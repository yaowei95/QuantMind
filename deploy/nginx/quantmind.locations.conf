# QuantMind Web 前端：原生 Nginx location 片段（include 进某个 server 块使用）
#
# 占位符：
#   @BACKEND_HOST@  QuantMind 后端 IP（docker compose 映射的 8000/8003）；须填 IP，
#                   变量式 proxy_pass 遇到域名需额外配 resolver
#   @HTML_ROOT@     静态根目录；前端文件位于 @HTML_ROOT@@WEB_PATH@
#   @WEB_PATH@      访问子路径，以 / 开头和结尾，如 /QuantMind/；独占站点用 /
#
# 生成并挂到现有 server 块（完整步骤见 deploy/README.md「Web 前端（原生 Nginx）」）：
#   sed -e 's#@BACKEND_HOST@#<后端 IP>#' -e 's#@HTML_ROOT@#/usr/share/nginx/html#' \
#       -e 's#@WEB_PATH@#/QuantMind/#' deploy/nginx/quantmind.locations.conf \
#       | sudo tee /etc/nginx/quantmind.locations.conf >/dev/null
#   在目标 server { } 内加一行：include /etc/nginx/quantmind.locations.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 独占站点：server { listen 80; server_name _; include /etc/nginx/quantmind.locations.conf; }
#
# 后端换机器：只改下方 set $qm_backend 一行，然后 sudo nginx -t && sudo systemctl reload nginx
#
# 注意：前端 API/WebSocket 固定请求根路径 /api/ 与 /ws/，与 @WEB_PATH@ 无关，
# 所在 server 块不能再有其他服务占用 /api/ 前缀（更长的前缀如 /api/xxx/ 不受影响）。
# 放在 server 级 add_header / proxy_set_header 之下时，本片段的 location 会覆盖它们。

# 后端地址（唯一配置点）
set $qm_backend "@BACKEND_HOST@";

# ^~：前缀命中后不再匹配静态资源正则
location ^~ /api/ {
    # 变量式 proxy_pass 不带 URI：原样透传客户端请求 URI
    proxy_pass http://$qm_backend:8000;
    proxy_http_version 1.1;
    # SSE 流式分析需要关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # /api/ 下也有 WebSocket（如 qwenpaw-ws），透传客户端 Connection，无需 http 级 map
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    client_max_body_size 100M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# WebSocket 行情：剥离 /ws 前缀后转给 stream 服务
# （浏览器连 /ws/api/v1/ws/market → 8003 的 /api/v1/ws/market）
location ^~ /ws/ {
    # 变量式 proxy_pass 带 URI 时会整体替换而非前缀替换，故用 rewrite 剥离 /ws
    rewrite ^/ws/(.*)$ /$1 break;
    proxy_pass http://$qm_backend:8003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# 静态文件（前端路由为 HashRouter，无需 SPA 回退）
location ^~ @WEB_PATH@ {
    root @HTML_ROOT@;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # index.html 禁止缓存：旧 html 引用已清理的旧 chunk 会 404 白屏
    # （访问目录时 index 内部跳转到 index.html，同样命中这里）
    location ~* \.html$ {
        add_header Cache-Control "no-store, max-age=0";
    }

    # .mjs（PDF.js worker）：老版本 mime.types 没有该后缀，会以 octet-stream 下发被浏览器拒绝
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 7d;
    }

    # 带内容 hash 的构建产物长缓存
    location ~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
